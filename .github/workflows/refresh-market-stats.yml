# Monthly refresh of the Market Stats figures on the city, county, foreclosure
# and situation pages (tn-cash-for-homes/market-stats-data.php).
#
# Runs on the 20th, after Redfin's monthly update (second week) and Zillow's
# (mid-month). It downloads Redfin, Zillow and Census data, rebuilds the file,
# and runs the sanity checks in market-stats/build_market_stats.py.
#   - Checks pass: commit the new figures and market-stats/REFRESH_STATUS.md
#     to main, then deploy the theme.
#   - Anything fails: the live figures stay as they are. Only REFRESH_STATUS.md
#     is committed, saying what failed, and the run is marked failed so GitHub
#     emails the repository owner.

name: Refresh market stats

on:
  schedule:
    - cron: '0 15 20 * *'
  workflow_dispatch:

concurrency:
  group: refresh-market-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            market-stats
            tn-cash-for-homes/market-stats-data.php
            .github

      - name: Fetch public data
        id: fetch
        continue-on-error: true
        shell: bash  # -eo pipefail, so a failure inside '| tee' fails the step
        run: bash market-stats/fetch_market_data.sh "$RUNNER_TEMP/raw" 2>&1 | tee fetch.log

      - name: Build and check
        id: build
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash  # -eo pipefail, so a failure inside '| tee' fails the step
        run: |
          python3 -I market-stats/build_market_stats.py "$RUNNER_TEMP/raw" \
            --previous tn-cash-for-homes/market-stats-data.php \
            --php tn-cash-for-homes/market-stats-data.php 2>&1 | tee build.log

      - name: Write status note
        id: result
        env:
          FETCH: ${{ steps.fetch.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          today=$(date -u +'%B %-d, %Y')
          live=$(grep -o 'generated by market-stats/build_market_stats.py on [^.]*' tn-cash-for-homes/market-stats-data.php | sed 's/.* on //')
          {
            echo "# Market Stats refresh status"
            echo
            if [ "$FETCH" = success ] && [ "$BUILD" = success ]; then
              echo "**Last run: $today. Succeeded.** The figures on the site were updated on $live."
              echo
              echo "Notes from the build (cities using county figures, and why):"
              echo
              grep '^note ' build.log | sed 's/^note /- /' || echo "- none"
            else
              echo "**Last run: $today. FAILED. Nothing on the site changed.** The figures still live are from $live."
              echo
              echo "What failed:"
              echo
              echo '```'
              if [ "$FETCH" != success ]; then tail -20 fetch.log; else grep -A100 'CHECKS FAILED' build.log || tail -20 build.log; fi
              echo '```'
              echo
              echo "To retry after fixing it: Actions > Refresh market stats > Run workflow."
            fi
          } > market-stats/REFRESH_STATUS.md
          if [ "$FETCH" = success ] && [ "$BUILD" = success ] && ! git diff --quiet -- tn-cash-for-homes/market-stats-data.php; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -- tn-cash-for-homes/market-stats-data.php
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat market-stats/REFRESH_STATUS.md

      - name: Commit to main
        run: |
          git config user.name "market-stats refresh"
          git config user.email "actions@users.noreply.github.com"
          git add market-stats/REFRESH_STATUS.md tn-cash-for-homes/market-stats-data.php
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${{ steps.result.outputs.changed }}" = true ]; then msg="Market stats: monthly refresh"; else msg="Market stats: refresh failed, previous figures kept"; fi
          git commit -m "$msg"
          git push origin HEAD:main

      - name: Mark the run failed if the refresh failed
        if: steps.fetch.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-theme.yml
    secrets:
      WPPUSHER_HOOK_URL: ${{ secrets.WPPUSHER_HOOK_URL }}
      WPCOM_TOKEN: ${{ secrets.WPCOM_TOKEN }}
